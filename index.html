<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KarriereVejviser.dk</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Encode+Sans+Condensed:wght@400;600&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!--Top Bar-->
    <div class="topbar">
      <div class="topbar-container">
        <div class="topbar-left">
          <a href="#">Log ind</a>
          <a href="#">Opret profil</a>
          <a href="#">In English</a>
        </div>
        <div class="topbar-right">
          <a href="#" class="topbar-logo">KarriereVejviser.dk</a>
        </div>
      </div>
    </div>

    <!--Main Navigation-->
    <nav class="navbar">
      <div class="nav-container">
        <ul class="nav-links">
          <li><a href="#">Arbejdspladser</a></li>
          <li><a href="#">Karriereguides</a></li>
          <li><a href="#">Jobmuligheder</a></li>
          <li><a href="#" class="nav-highlight">Er du arbejdsgiver?</a></li>
        </ul>
      </div>
    </nav>

    <!--Hero Section-->
    <section class="hero">
      <div class="hero-image-container">
        <img
          src="images/hero.png"
          alt="To personer arbejder sammen foran en computer"
          class="hero-img"
        />
      </div>
      <div class="hero-content">
        <h1 class="hero-title">KarriereVejviser.dk</h1>
        <p class="hero-subtitle">
          Inspiration, karriereguides og tips til dit arbejdsliv
        </p>
        <div class="hero-buttons">
          <a href="#" class="btn btn-primary">Læs karriereguides</a>
          <a href="#" class="btn btn-secondary">Find job</a>
        </div>
      </div>
      <div class="hero-wave">
        <svg
          viewBox="0 0 1440 94"
          xmlns="http://www.w3.org/2000/svg"
          preserveAspectRatio="none"
        >
          <path
            d="M0,94 C360,0 1080,0 1440,94 L1440,94 L0,94 Z"
            fill="#f0f4f8"
          />
        </svg>
      </div>
    </section>

    <!--Stats-grid Section-->
    <section class="stats-section">
      <div class="stats-container">
        <!--Række 1: Hvid venstre, blå højre-->
        <div class="stats-row">
          <div class="stats-card white-card">
            <img
              src="images/icon-arbejdspladser.png"
              alt="Arbejdspladser ikon"
              class="stats-icon"
            />
            <h3 class="stats-title">Arbejdspladser</h3>
            <p class="stats-desc"></p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
